  <text x="140" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#152426">the organization</text>
  <text x="140" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#566466">policy</text>
  <text x="140" y="138" text-anchor="middle" font-size="12.5" font-weight="400" fill="#566466">precedent</text>
  <text x="140" y="168" text-anchor="middle" font-size="12.5" font-weight="400" fill="#566466">expertise</text>
  <text x="140" y="198" text-anchor="middle" font-size="12.5" font-weight="400" fill="#566466">hard-won exceptions</text>
  <path d="M246,148.7 Q284,149.9 321.9,147.2 M322.4,147.6 Q317.9,151.9 312.2,154 M322,148 Q317.9,144.2 312.9,142.4" fill="none" stroke="#152426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="284" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#566466">judgment</text>
  <path d="M324.7,83.1 Q443,83 559.9,83.9 Q562,148 558.9,213.1 Q443,213.2 327.2,211.7 Q327.4,148 326.9,85.1 Z" fill="#e4f3e7" stroke="none" opacity="0.55"/>
  <path d="M324.9,85.1 Q443,86.2 560.8,82.9 M559,83.9 Q559,148 560.5,213.2 M559.7,210.8 Q443,209.7 326.1,210.7 M327.3,212.8 Q326.3,148 326.1,83.7 M325.6,82.9 Q443,85.2 559.3,82.9 M560.5,84.6 Q561.5,148 560.8,211.3 M559.5,212.5 Q443,212.1 326.6,212.5 M325.4,212.5 Q323.3,148 326.2,84" fill="none" stroke="#152426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="443" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#152426">decisions</text>
  <text x="443" y="146" text-anchor="middle" font-size="13" font-weight="500" fill="#566466">approve  ·  reject</text>
  <text x="443" y="172" text-anchor="middle" font-size="13" font-weight="500" fill="#566466">escalate  ·  hold</text>
  <text x="300" y="276" text-anchor="middle" font-size="12.5" font-weight="500" fill="#566466">Hand the work to AI and this arrow is what matters most —</text>
  <text x="300" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#152426">and it is the one thing nobody wrote down.</text>
