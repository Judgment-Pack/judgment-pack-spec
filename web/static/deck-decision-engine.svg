<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 316" role="img" aria-labelledby="de-t de-d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="de-t">The organization turns policy, precedent, and expertise into decisions</title>
  <desc id="de-d">An organization box holds policy, precedent, expertise, and hard-won exceptions. An arrow labelled judgment leads from it to a box of decisions: approve, reject, escalate, hold. When execution is handed to an agent, that arrow is the only thing that matters — and it is the one thing nobody wrote down.</desc>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#152426">What a company actually produces</text>
