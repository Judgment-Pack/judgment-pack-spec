<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 412" role="img" aria-labelledby="cl-t cl-d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="cl-t">What conformance establishes, and what it never establishes</title>
  <desc id="cl-d">Four filled rows above a drawn line: carrier — the bytes parse as declared; structural — the document fits the schema; semantic — its references and cross-field rules hold; evaluator — an implementation computes the specified result. Below the line, drawn in outline only: factual grounding, authorization, and operational fitness. The specification stops at the line on purpose.</desc>
  <text x="300" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#152426">What this establishes — and what it never does</text>
  <path d="M39.5,44.4 Q300,43.7 559.6,44.4 Q559,62 560.9,80.4 Q300,79.4 40.3,79.1 Q39.3,62 40.9,43.9 Z" fill="#e4f3e7" stroke="none" opacity="0.55"/>
  <path d="M40.2,44.2 Q300,42.6 559.8,44.2 M560.2,44 Q559.5,62 560.9,79.7 M560.3,80.1 Q300,80.7 39.2,80.9 M39.2,79.1 Q42.2,62 40.5,43.9 M39.3,43.9 Q300,42.6 560.1,44.5 M559.5,43.5 Q557.8,62 559.7,79.7 M559.2,79.6 Q300,77.8 39.3,79.9 M40.6,79.4 Q40.8,62 40,44.9" fill="none" stroke="#152426" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="67" text-anchor="start" font-size="13.5" font-weight="700" fill="#152426">Readable</text>
  <text x="180" y="67" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">the file opens, and is what it says it is</text>
  <path d="M39.7,88.6 Q300,90.1 560.1,88.4 Q561,106 559.2,124 Q300,125.8 40,124 Q37.7,106 40.7,87.2 Z" fill="#e4f3e7" stroke="none" opacity="0.55"/>
  <path d="M40.5,88.4 Q300,86.3 559.9,87.7 M559.6,87.3 Q559.8,106 560.9,123.1 M560.4,124.9 Q300,124.2 39.2,123.7 M40.4,123.9 Q38,106 39.4,88.8 M40.2,87.2 Q300,86.8 559.1,88.1 M559.3,87.6 Q561.9,106 560.5,124.6 M560.2,123.4 Q300,122.9 40,124.5 M39.7,123.4 Q40.9,106 40.8,87.8" fill="none" stroke="#152426" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="111" text-anchor="start" font-size="13.5" font-weight="700" fill="#152426">Well-formed</text>
  <text x="180" y="111" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">every part is present and correctly shaped</text>
  <path d="M40.7,132.3 Q300,131.1 560.4,131.8 Q558.6,150 560.1,167.4 Q300,169.3 40.8,167.6 Q41.5,150 40.7,131.6 Z" fill="#e4f3e7" stroke="none" opacity="0.55"/>
  <path d="M40.4,131.1 Q300,133.4 559.6,132.3 M559.3,131.2 Q559.6,150 560.2,168.3 M560.9,168.7 Q300,167.1 40.9,168.2 M39.4,168.6 Q38.4,150 40.4,131.2 M40.3,131.7 Q300,133.2 560.3,131.6 M560.4,132 Q562,150 559.3,168 M560.3,167.5 Q300,168.4 40.5,167.7 M39.8,168.8 Q38.4,150 40.5,132.8" fill="none" stroke="#152426" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="155" text-anchor="start" font-size="13.5" font-weight="700" fill="#152426">Joined up</text>
  <text x="180" y="155" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">every reference resolves, every name is unique</text>
  <path d="M40.8,176.6 Q300,175.2 560.2,176.3 Q560.3,194 559.8,212.8 Q300,213 39.1,212.4 Q38.1,194 40.9,175.9 Z" fill="#e4f3e7" stroke="none" opacity="0.55"/>
  <path d="M40,175.2 Q300,178.1 560.4,176 M559.3,176.3 Q561.1,194 559.8,211.1 M560.3,212.4 Q300,210 40.2,212.2 M39.6,211.8 Q42,194 40.5,175.2 M40.7,176.4 Q300,176.7 560.8,175 M559.9,176.8 Q560.9,194 559.8,211.1 M559.4,212.5 Q300,211.8 39.1,212.7 M40.4,212.3 Q40.8,194 39.9,176.6" fill="none" stroke="#152426" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="199" text-anchor="start" font-size="13.5" font-weight="700" fill="#152426">Evaluated</text>
  <text x="180" y="199" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">an engine claiming this computes the specified result</text>
  <path d="M25.3,231.4 Q300,230.9 574.7,231.8" fill="none" stroke="#8d3026" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <path d="M26.3,236.3 Q300,233.4 574.4,235.9" fill="none" stroke="#8d3026" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <text x="300" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8d3026">nothing below this line is ever claimed</text>
  <path d="M40.8,268.5 Q300,268.4 560,267.9 M560.3,268 Q562.3,286 560.8,303.1 M560.8,303.7 Q300,304.9 39.4,304.5 M39.8,304.9 Q42.2,286 39.1,267.3 M39.4,268.1 Q300,266.4 559.5,268.6 M560.8,267.9 Q558.5,286 559.7,303.6 M560.6,304.2 Q300,304 40,304.1 M40.8,303.3 Q38.7,286 40,267.1" fill="none" stroke="#566466" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="291" text-anchor="start" font-size="13.5" font-weight="700" fill="#566466">Is it true?</text>
  <text x="210" y="291" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">whether the facts behind it are real</text>
  <path d="M39.4,311.9 Q300,310.1 559.7,312.2 M559.9,312.3 Q561.9,330 560.5,347.3 M559.7,347.2 Q300,350.2 40.6,348.2 M39.6,347.2 Q41.2,330 39,312.4 M39.9,312.3 Q300,313.6 559.4,312.2 M560.3,311.1 Q561,330 559.5,347.8 M560.9,347.8 Q300,347.4 39.4,348.5 M40.6,348.7 Q41.1,330 40.4,312.2" fill="none" stroke="#566466" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="335" text-anchor="start" font-size="13.5" font-weight="700" fill="#566466">Is it allowed?</text>
  <text x="210" y="335" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">whether anyone with authority approved it</text>
  <path d="M39.6,356.7 Q300,357.4 559.2,356.7 M560.4,356.3 Q560.3,374 559.9,391.4 M559.3,392.1 Q300,391.9 40.7,392 M40.8,391.8 Q38.8,374 39.6,355.2 M40.5,355.4 Q300,354.8 560.3,355.8 M560.2,356.8 Q558.9,374 560.7,392.3 M559.2,392.7 Q300,389.7 39.1,391.8 M39.1,392.3 Q38.3,374 39.5,355.5" fill="none" stroke="#566466" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="58" y="379" text-anchor="start" font-size="13.5" font-weight="700" fill="#566466">Is it safe?</text>
  <text x="210" y="379" text-anchor="start" font-size="12.5" font-weight="400" fill="#566466">whether acting on it here is wise</text>
</svg>
