<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344" role="img" aria-labelledby="ai-t ai-d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ai-t">Attested inputs: signed receipts, a sealed session, and a public-key verifier</title>
  <desc id="ai-d">A source is run by the gateway, which signs each result into a receipt. Receipts are chained per session and the session is then sealed. A verifier checks the chain and the seal using only the public key, so checking grants no power to forge. The mechanism proves the byte-lineage of the inputs a judgment was computed over — never that those bytes are true.</desc>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#152426">The model cannot forge the signature</text>
