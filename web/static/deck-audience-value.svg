<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 326" role="img" aria-labelledby="av-t av-d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="av-t">One decision file, read by three different people</title>
  <desc id="av-d">A decision written down feeds three readers. Engineering gets logic that outlives the tool. The policy owner gets rules they can read without code. Risk and audit get what the system was supposed to do. The reasoning stops belonging to one tool.</desc>
