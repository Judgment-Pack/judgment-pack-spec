  <text x="150" y="181" text-anchor="middle" font-size="13" font-weight="600" fill="#152426">Go reference runtime</text>
  <path d="M344.7,146.3 Q450,148 555.4,145.7 M554.9,146.8 Q556.8,176 556.2,206.3 M555.6,205.1 Q450,208.4 344.6,206.1 M343,205.5 Q342,176 344.9,147 M344.9,146.6 Q450,144.1 556.3,146.7 M554.9,145.6 Q556.6,176 554.9,205.3 M556.4,205.8 Q450,205.3 344.1,205.8 M343.9,205.7 Q346.1,176 345,146" fill="none" stroke="#152426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
