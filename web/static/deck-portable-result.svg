<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 378" role="img" aria-labelledby="pr-t pr-d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pr-t">Two independent implementations produce one byte-identical result</title>
  <desc id="pr-d">One pack and its facts feed two separately written implementations — the Go reference runtime and a clean-room evaluator, each written from the specification text alone. Both produce one disposition, byte-identical after RFC 8785 canonicalization. A disagreement between them locates ambiguity in the prose.</desc>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#152426">Same pack, same facts, different engines</text>
