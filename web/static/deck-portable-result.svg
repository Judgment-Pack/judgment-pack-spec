  <text x="300" y="301" text-anchor="middle" font-size="15" font-weight="600" fill="#152426">one disposition</text>
  <text x="300" y="319" text-anchor="middle" font-size="12" font-weight="400" fill="#566466">byte-identical after RFC 8785</text>
  <text x="300" y="358" text-anchor="middle" font-size="12" font-weight="500" fill="#566466">If two independent readers disagree, the prose was ambiguous — that is the point of the test.</text>
</svg>
