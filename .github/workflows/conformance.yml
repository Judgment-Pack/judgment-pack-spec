name: Repository conformance

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# One job, `repository-conformance`, which branch protection requires by name: it sets the toolchains
# up from the manifest and runs the checks. A pull request runs `check.sh --changed` against its
# base branch: the checks jpdev.json maps the changed paths to, and the whole list when a path is
# unmapped, when the mapping, the manifest or the runner changed, or with no mapping. A push to
# main runs the whole list, and only a push to main records the evidence a release takes
# (scripts/dev/release_evidence.py capture; .github/ci-evidence.json; web/DEPLOYMENT.md, "Release
# evidence").

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-conformance:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that --changed finds the merge base with the base branch.
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, so that a manifest that does not parse fails before the long steps start.
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("node=" + tc.get("node", {}).get("version", ""))
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.dev.outputs.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.dev.outputs.node }}

      # Installs requirements-dev.txt. The pinned `jsonschema[format-nongpl]` matters: without its
      # extras the `format` keyword is silently ignored (CONTRIBUTING.md, "Local checks").
      - name: Setup steps
        run: |
          set -o pipefail
          scripts/dev/check.sh --setup | tee "${{ runner.temp }}/setup.log"

      # Repository artifacts and the static site (tests/); the exploratory Policy companion
      # prototype (non-normative); the proposed draft Policy companion contract (not adopted); the
      # staged Policy official-draft promotion (unreleased).
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF" | tee "${{ runner.temp }}/checks.log"
          else
            scripts/dev/check.sh --all | tee "${{ runner.temp }}/checks.log"
          fi

      # A push to main only: the commit's input identities, the runner, the tools and the installed
      # requirements (.venv, which the checks ran in), and every setup step and check PASS.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >-
          python3 scripts/dev/release_evidence.py capture
          --workflow conformance --job repository-conformance
          --setup-log "${{ runner.temp }}/setup.log"
          --check-log "${{ runner.temp }}/checks.log"
          --output "${{ runner.temp }}/evidence.json"

      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-conformance-repository-conformance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7
