name: Repository conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check repository artifacts and static site
        run: python -m unittest discover -s tests -v

      - name: Check exploratory Policy companion prototype (non-normative)
        run: python -m unittest discover -s rfcs/policy-companion-prototype -p 'test_*.py' -v

      - name: Check proposed draft Policy companion contract (not adopted)
        run: python -m unittest discover -s rfcs/policy-companion-contract -p 'test_*.py' -v
