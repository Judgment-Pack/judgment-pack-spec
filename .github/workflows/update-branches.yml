# Vendor as .github/workflows/update-branches.yml. Keeps open pull-request branches current with
# the default branch; conflicts receive the `carry needed` label for a coordinator to resolve.
name: update-branches

on:
  push:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Update branches that are behind
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseCommit = context.sha;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: context.payload.repository.default_branch,
            });
            for (const pull of pulls) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${pull.head.sha}...${baseCommit}`,
              });
              if (comparison.data.status !== 'ahead' && comparison.data.status !== 'diverged') continue;
              try {
                await github.rest.pulls.updateBranch({
                  owner, repo, pull_number: pull.number, expected_head_sha: pull.head.sha,
                });
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pull.number, name: 'carry needed',
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              } catch (error) {
                if (error.status !== 409 && error.status !== 422) throw error;
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pull.number, labels: ['carry needed'],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull.number,
                  body: `Carry needed from base commit ${baseCommit}.`,
                });
              }
            }
