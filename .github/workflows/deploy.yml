name: Deploy site

# Publication of an explicitly planned Core or Policy release deploys its immutable tag.
# The production environment retains the repository's human approval boundary.
on:
  release:
    types: [published]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: judgmentpack-spec
  BASE_URL: https://judgmentpack.org
  SPEC_SITE: judgmentpack-spec
  REDIRECT_SITE: judgmentpack-redirect
  WIF_PROVIDER: projects/350082883663/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: gh-deploy@judgmentpack-spec.iam.gserviceaccount.com

jobs:
  production:
    if: startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'policy-v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out published tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release milestone and tagged checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/release_milestone.py --tag "$RELEASE_TAG" --commit "${GITHUB_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Build production
        run: |
          python web/build.py --environment production \
            --base-url "${BASE_URL}" \
            --commit-sha "$(git rev-parse HEAD)" \
            --build-time "$(git show -s --format=%cI HEAD)"
      - name: Validate production artifact
        run: |
          python -m unittest discover -s tests -p 'test_site.py' -v
          grep -Fq '<link rel="canonical" href="https://judgmentpack.org/">' public/index.html
          grep -Fxq 'Allow: /' public/robots.txt
          grep -Fxq 'Sitemap: https://judgmentpack.org/sitemap.xml' public/robots.txt
          test -f public/sitemap.xml
          mapfile -t noindex_pages < <(grep -R -l -F '<meta name="robots" content="noindex, nofollow">' public --include='*.html')
          test "${#noindex_pages[@]}" -eq 1
          test "${noindex_pages[0]}" = "public/404.html"
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned on purpose: a bump is a reviewed change, since 15.34.1 (2026-10-21) began reading the
      # Service Usage API before deploying (the deploy account holds Service Usage Viewer for it).
      - run: npm install -g firebase-tools@15.34.1
      - name: Deploy live (spec + redirect)
        run: |
          firebase target:apply hosting spec "${SPEC_SITE}" --project "${GCP_PROJECT}"
          firebase target:apply hosting redirect "${REDIRECT_SITE}" --project "${GCP_PROJECT}"
          firebase deploy --only hosting --project "${GCP_PROJECT}" --non-interactive
